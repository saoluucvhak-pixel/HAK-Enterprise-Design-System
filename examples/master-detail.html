<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>

<style>
/* Chủ đề V10.3 "luxe" (mặc định). Nguồn: HAK_LUONG_OFFLINE, nhánh design/hak-enterprise-v10-4, LuongHAK_Offline/style.css, commit 715b043.
   Chủ đề hiệu lực:
     sáng = :root + [data-skin="luxe"]

   Giữ nguyên giá trị gốc; chỉ thêm --mut-aa cho chữ phụ đạt tương phản ≥ 4,5:1 trên nền sáng (xem tests/contrast.test.js). */
:root{--brand:#0e7c86;--brand2:#14a3ad;--brandH:#0b6870;--brandA:#095961;--brandSoft:rgba(14,124,134,.12);--onBrand:#fff;
--bg:#f3f6fa;--card:#fff;--ink:#14212b;--mut:#6b7a8c;--line:#e3e9f0;--line2:#edf1f4;--ctl:#d3dce2;--th:#f5f8fa;--hover:#f1f7f8;--field:#fff;
--sb:linear-gradient(180deg,#0f2740 0%,#0a1c30 100%);--sbText:#b8c7d9;--sbMut:#7d8fa3;--sbLine:rgba(255,255,255,.08);

--hero:radial-gradient(1200px 300px at 90% -20%,rgba(255,255,255,.18),transparent 60%),linear-gradient(120deg,#0f2740,#0e7c86);
--we:#eef2f5;--c1:#e2f1f2;--c1f:#0b6870;--cH:#eef2f5;--cHf:#14212b;--cP:#e7eef8;--cPf:#23497a;--cO:#f8eed9;--cOf:#8a5a12;--cTC:#efe9fb;--cTCf:#4e3a9a;
/* tên cũ (guide.js, bản in) */
--pri:var(--brand);--pri2:var(--brandH);--priL:var(--okBg);--deep:#0f2740;--champ:#d99a2b;--champL:#f0cf8f;
color-scheme:light}

[data-theme="dark"]{--brand:#21b5c0;--brand2:#47c8d1;--brandH:#47c8d1;--brandA:#6bd4db;--brandSoft:rgba(33,181,192,.16);--onBrand:#062c30;
--bg:#0d151e;--card:#15202c;--ink:#e3eaf2;--mut:#8ea0b5;--line:#243244;--line2:#1d2a38;--ctl:#33465a;--th:#1a2633;--hover:#1b2a38;--field:#101a25;
--sb:linear-gradient(180deg,#0a1826 0%,#071019 100%);
--warnBg:#2a2213;--warnBd:#5a4520;--warnFg:#f0cf8f;--warn:#f0b35a;--red:#ff8a6a;--redBg:#3a1e17;--okBg:rgba(33,181,192,.16);--okFg:#7fdbe2;
--infoBg:#18243a;--infoBd:#2c3d5c;--infoFg:#c3d3f0;--edit:#e0a948;--editBg:#2a2213;--focus:rgba(33,181,192,.3);
--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);--shadowH:0 10px 26px rgba(0,0,0,.45);
--hero:radial-gradient(1200px 300px at 90% -20%,rgba(255,255,255,.10),transparent 60%),linear-gradient(120deg,#0a1826,#0e5f68);
--we:#1a2633;--c1:rgba(33,181,192,.18);--c1f:#7fdbe2;--cH:#223142;--cHf:#e3eaf2;--cP:#1e2c45;--cPf:#a9c3ef;--cO:#33281a;--cOf:#f0cf8f;--cTC:#2a2340;--cTCf:#c7b8ff;
--deep:#0a1826;color-scheme:dark}
[data-theme="dark"]{--mut-aa:var(--mut)}
[data-skin="luxe"]{--brand:#1d3a63;--brand2:#2d5388;--brandH:#142b4b;--brandA:#0e203a;--brandSoft:rgba(29,58,99,.10);--onBrand:#fff;
--bg:#f5f2ec;--card:#fffefb;--ink:#1a2130;--mut:#756f63;--line:#e5dfd1;--line2:#eee9dc;--ctl:#d5cdbb;--th:#f1ece0;--hover:#f6f1e5;--field:#fff;
--sb:linear-gradient(180deg,#0f1b33 0%,#0a1220 100%);--sbText:#c8cfdc;--sbMut:#8d97aa;--sbLine:rgba(214,178,106,.18);
--warnBg:#faf3e3;--warnBd:#e6d3a3;--warnFg:#6b4a10;--okBg:#e8eef7;--okFg:#1d3a63;
--infoBg:#eef1f7;--infoBd:#cdd5e6;--infoFg:#22345a;--edit:#b8903f;--editBg:#fdf8ec;--focus:rgba(184,144,63,.30);
--shadow:0 1px 2px rgba(26,33,48,.05),0 8px 22px rgba(26,33,48,.07);--shadowH:0 12px 28px rgba(29,58,99,.16);--r:12px;
--hero:radial-gradient(1200px 300px at 90% -20%,rgba(214,178,106,.22),transparent 60%),linear-gradient(120deg,#0f1b33,#1d3a63);
--c1:#e8eef7;--c1f:#1d3a63;--deep:#0f1b33;--champ:#b8903f;--champL:#e6cf9b;--gold:#c9a45c}
[data-skin="luxe"][data-theme="dark"]{--brand:#d4b06a;--brand2:#e3c88f;--brandH:#e3c88f;--brandA:#efd9a8;--brandSoft:rgba(212,176,106,.16);--onBrand:#1b1405;
--bg:#0b101a;--card:#121926;--ink:#e8e6df;--mut:#9aa0ad;--line:#232c3d;--line2:#1b2434;--ctl:#344058;--th:#18202f;--hover:#19222f;--field:#0e1420;
--sb:linear-gradient(180deg,#090e19 0%,#060a12 100%);
--okBg:rgba(212,176,106,.14);--okFg:#e3c88f;--focus:rgba(212,176,106,.32);--edit:#d4b06a;--editBg:#251f12;
--hero:radial-gradient(1200px 300px at 90% -20%,rgba(212,176,106,.14),transparent 60%),linear-gradient(120deg,#090e19,#1a2b49);
--c1:rgba(212,176,106,.16);--c1f:#e3c88f;--deep:#090e19}

/* Chủ đề thứ 5 "reu" (xanh rêu / kem, tiêu đề bảng nền tối) — tùy chọn, KHÔNG phải mặc định (mặc định là luxe).
   Nguồn bảng màu: skill quan-ly-bang-me-bang-con (references/style-tokens.css). Đã chỉnh vài giá trị để chữ đạt tương phản AA ≥ 4,5:1
   (xem tests/contrast.test.js): --mut-aa tối hơn --mut gốc; nút chính dùng xanh đậm #2F5B45.
   Dùng: nạp SAU tokens/luxe.css, đặt <html data-skin="reu"> (tối: thêm data-theme="dark"). */
[data-skin="reu"]{--brand:#2F5B45;--brand2:#3E7057;--brandH:#244937;--brandA:#1b3a2b;--brandSoft:rgba(62,112,87,.12);--onBrand:#fff;
--bg:#F1EFE9;--card:#fff;--ink:#1C1C1A;--mut:#77756A;--line:#E5E2D8;--line2:#ECE9E0;--ctl:#D6D2C5;--th:#141F19;--thInk:#fff;--hover:#F4F1EA;--field:#fff;
--sb:linear-gradient(180deg,#141F19 0%,#101812 100%);--sbText:#cfd6d0;--sbMut:#93a096;--sbLine:rgba(217,154,78,.18);
--warnBg:#FBF1E3;--warnBd:#EBCFA6;--warnFg:#6E4A14;--okBg:#E7F0EA;--okFg:#2F5B45;--red:#B4453B;--redBg:#F8E6E3;
--infoBg:#EEF2EF;--infoBd:#CCD8CF;--infoFg:#24402f;--edit:#D99A4E;--editBg:#FDF6EC;--focus:rgba(62,112,87,.28);
--shadow:0 1px 2px rgba(20,31,25,.05),0 8px 22px rgba(20,31,25,.07);--shadowH:0 12px 28px rgba(20,31,25,.18);--r:12px;
--c1:#E7F0EA;--c1f:#2F5B45;--deep:#141F19;--champ:#D99A4E;--champL:#ecc48f;--mut-aa:#625f55}
[data-skin="reu"][data-theme="dark"]{--brand:#8fc3a6;--brand2:#a9d4bb;--brandH:#a9d4bb;--brandA:#c2e3d0;--brandSoft:rgba(143,195,166,.16);--onBrand:#0d1a13;
--bg:#0e1511;--card:#151e18;--ink:#e6e8e3;--mut:#9aa69d;--line:#26332b;--line2:#1d2822;--ctl:#36463c;--th:#0a100c;--thInk:#e6e8e3;--hover:#1a251f;--field:#101813;
--warnBg:#2a2213;--warnFg:#f0cf8f;--okBg:rgba(143,195,166,.14);--okFg:#a9d4bb;--red:#ff8a7a;--redBg:#3a1e17;
--infoBg:#18241d;--infoFg:#c7dccd;--focus:rgba(143,195,166,.3);--edit:#e0a948;--editBg:#251f12;
--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);--shadowH:0 10px 26px rgba(0,0,0,.45);--mut-aa:#9aa69d;color-scheme:dark}

/* Portable HAK Enterprise theme contract; use with --bg,--card,--ink,--line,--brand CSS tokens. */
.hak-ui { background:var(--bg);color:var(--ink); }
.hak-ui .hak-panel {background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:0}
.hak-ui .hak-toolbar {display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px}
.hak-ui .hak-master-detail {display:grid;grid-template-columns:minmax(0,3fr) minmax(320px,2fr);gap:12px}
.hak-ui .hak-table-region {min-width:0;overflow:auto}
.hak-ui .hak-detail-tabs {display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--line)}
.hak-ui .hak-detail-tabs > * {white-space:nowrap}
.hak-ui :focus-visible {outline:2px solid var(--brand);outline-offset:2px}
@media(max-width:1100px){.hak-ui .hak-master-detail{grid-template-columns:1fr}}

/* ---- Bổ sung V10.5: chuẩn UX (theo docs/UX_RULES.md). Chỉ dùng biến token, không mã màu cứng. ---- */
/* Số liệu: căn phải, chữ số cùng độ rộng */
.hak-ui .hak-num {text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* Bảng: tiêu đề cố định khi cuộn trong vùng bảng */
.hak-ui .hak-table {border-collapse:collapse;width:100%}
.hak-ui .hak-table th {position:sticky;top:0;z-index:1;background:var(--th);color:var(--thInk, var(--ink));text-align:left;font-weight:600}
.hak-ui .hak-table th, .hak-ui .hak-table td {padding:8px 10px;border-bottom:1px solid var(--line2, var(--line))}
.hak-ui .hak-table tbody tr:hover {background:var(--hover)}
.hak-ui .hak-table tr[aria-selected="true"] {background:var(--brandSoft)}
/* Trạng thái rỗng / đang tải / lỗi */
.hak-ui .hak-state {padding:24px;text-align:center;color:var(--mut-aa, var(--mut))}
.hak-ui .hak-state[data-state="error"] {color:var(--red)}
/* Chữ phụ đạt tương phản AA */
.hak-ui .hak-muted {color:var(--mut-aa, var(--mut))}
/* Form: lỗi ngay cạnh ô */
.hak-ui .hak-field-error {color:var(--red);font-size:13px;margin-top:4px}
.hak-ui [aria-invalid="true"] {border-color:var(--red)}
/* Vùng bấm tối thiểu cho desktop */
.hak-ui .hak-btn {min-height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--ctl);background:var(--card);color:var(--ink);cursor:pointer}
.hak-ui .hak-btn-primary {background:var(--brand);border-color:var(--brand);color:var(--onBrand)}
.hak-ui .hak-btn:disabled {opacity:.55;cursor:not-allowed}
/* Chỉ cho trình đọc màn hình */
.hak-ui .hak-sr-only {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* Tôn trọng người dùng giảm chuyển động */
@media (prefers-reduced-motion:reduce){.hak-ui *, .hak-ui *::before, .hak-ui *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ---- Master–Detail component (components/master-detail.js). Chỉ dùng token. ---- */
.hak-md{display:block;min-width:0;color:var(--ink);font-size:14px;line-height:1.45}
.hak-md-head{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.hak-md-breadcrumb ol{display:flex;flex-wrap:wrap;gap:4px;list-style:none;margin:0;padding:0;font-size:12px;color:var(--mut-aa, var(--mut))}
.hak-md-breadcrumb li+li::before{content:"›";margin-right:4px;color:var(--mut-aa, var(--mut))}
.hak-md-breadcrumb [aria-current=page]{color:var(--ink);font-weight:600}
.hak-md .hak-md-link{border:0;background:transparent;color:var(--brand);padding:0;min-height:0;cursor:pointer;text-decoration:underline;font:inherit}
.hak-md-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hak-md-title-row h1{margin:0;font-size:22px;line-height:1.3;letter-spacing:-.3px}
.hak-md-actions{display:flex;gap:6px;flex-wrap:wrap}
.hak-md-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.hak-md-metric{border:1px solid var(--line);background:var(--card);border-radius:var(--r, 12px);padding:10px 12px;min-width:0}
.hak-md-metric small{display:block;font-size:12px;color:var(--mut-aa, var(--mut))}
.hak-md-metric strong{display:block;font-size:22px;line-height:1.3}
.hak-md .hak-panel{box-shadow:var(--shadow)}
.hak-md-pane-title{margin:0;font-size:15px;font-weight:700;flex:1 1 auto}
.hak-md-search{flex:1 1 220px;max-width:340px}
.hak-md-search input{width:100%;min-height:32px;border:1px solid var(--ctl);border-radius:8px;padding:0 10px;background:var(--field);color:var(--ink);font:inherit}
.hak-md .hak-table tbody tr[tabindex]{cursor:pointer}
.hak-md .hak-table td.hak-md-center{text-align:center}
.hak-md-actions-col{width:1%}
.hak-md-row-actions{white-space:nowrap;text-align:right}
.hak-md-row-actions .hak-btn{min-height:28px;padding:0 8px;margin-left:4px;font-size:12px}
.hak-md-tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;white-space:nowrap;background:var(--infoBg);color:var(--infoFg)}
.hak-md-tag[data-status=current]{background:var(--okBg);color:var(--okFg)}
.hak-md-tag[data-status=future]{background:var(--warnBg);color:var(--warnFg)}
.hak-md-tag[data-status=expired]{background:var(--th);color:var(--mut-aa, var(--mut))}
.hak-md-detail{padding-bottom:8px}
.hak-md-detail-head{border-bottom:1px solid var(--line)}
.hak-md-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px;padding:0}
.hak-md-field dt{font-size:12px;color:var(--mut-aa, var(--mut));margin-bottom:4px}
.hak-md-field dd{margin:0;border:1px solid var(--line);background:var(--bg);padding:7px 9px;border-radius:6px;min-height:34px;overflow-wrap:anywhere}
.hak-md-tabs{margin:4px 12px 0;padding:0}
.hak-md .hak-md-tab{border:0;border-radius:0;background:transparent;color:var(--mut-aa, var(--mut));padding:8px 10px;min-height:36px;font:inherit;cursor:pointer}
.hak-md .hak-md-tab[aria-selected=true]{color:var(--brand);border-bottom:2px solid var(--brand);font-weight:700}
.hak-md-count{font-variant-numeric:tabular-nums;color:var(--mut-aa, var(--mut));font-weight:400}
.hak-md-tabpanel{padding:0 12px}
.hak-md-overlay{position:fixed;inset:0;background:var(--focus);display:flex;justify-content:flex-end;z-index:50}
.hak-md-drawer{width:min(460px,100%);height:100%;background:var(--card);color:var(--ink);box-shadow:var(--shadowH);display:flex;flex-direction:column;border-radius:var(--r, 12px) 0 0 var(--r, 12px)}
.hak-md-drawer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.hak-md-drawer-head h2{margin:0;font-size:16px}
.hak-md .hak-md-close{min-width:32px}
.hak-md-form{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.hak-md-input label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.hak-md-input input:not([type=checkbox]),.hak-md-input select,.hak-md-input textarea{width:100%;min-height:34px;border:1px solid var(--ctl);border-radius:8px;padding:6px 10px;background:var(--field);color:var(--ink);font:inherit}
.hak-md-req{color:var(--red)}
.hak-md-hint{font-size:12px;margin-top:3px}
.hak-md-error-summary{border:1px solid var(--red);background:var(--redBg);color:var(--ink);border-radius:8px;padding:10px 12px}
.hak-md-error-summary a{color:var(--red)}
.hak-md-drawer-foot{display:flex;justify-content:flex-end;gap:8px;padding-top:8px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
.hak-md-toast{min-height:0;margin-top:8px;font-size:13px}
.hak-md-toast:empty{display:none}
.hak-md-toast[data-kind=ok]{color:var(--okFg)}
.hak-md-toast[data-kind=warn]{color:var(--warnFg)}
.hak-md-toast[data-kind=error]{color:var(--red)}
@media (max-width:700px){.hak-md-fields{grid-template-columns:1fr}.hak-md-drawer{border-radius:0}}

/* Bố cục trang demo: một thanh chủ đề phía trên, component chiếm phần còn lại. Màu lấy từ token của Design System. */
:root{--demo-font:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--demo-font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.demo-wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.demo-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:var(--r,12px);padding:10px 14px}
.demo-bar p{margin:0;font-size:13px;color:var(--mut-aa,var(--mut));max-width:60ch}
.demo-bar strong{color:var(--ink)}
.demo-seg{display:inline-flex;border:1px solid var(--ctl);border-radius:999px;padding:2px;gap:2px}

.demo-seg button[aria-pressed=true]{background:var(--brand);color:var(--onBrand)}
.demo-seg button:focus-visible,.hak-md :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hak-md button,.hak-md input,.hak-md select,.hak-md textarea{font-family:var(--demo-font)}
.hak-md .hak-panel{min-width:0}
.hak-md .hak-toolbar{justify-content:space-between}
.demo-confirm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--focus);z-index:60;padding:16px}
.demo-confirm>div{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r,12px);box-shadow:var(--shadowH);padding:16px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
.demo-confirm p{margin:0}
.demo-confirm .row{display:flex;justify-content:flex-end;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/**
 * HAK Master–Detail — bộ component bảng cha–con dùng chung (V10.5).
 *
 * Hợp nhất:
 *  - cách làm khai báo bằng cấu hình, đào sâu nhiều cấp, tự đóng phiên bản hiệu lực, luồng nháp → duyệt

  // ------------------------------------------------------------------ GIAO DIỆN

    function table(t, list, selectedId, onPick, actions) {

      if (!list.length) return el(doc, "div", "hak-state", model.getSearch(t) ? "Không có " + lc(c.label) + " khớp từ khóa." : "Chưa có " + lc(c.label) + ".", { "data-state": "empty" });
      var wrap = el(doc, "div", "hak-table-region");
      var tb = el(doc, "table", "hak-table"), thead = el(doc, "thead"), hr = el(doc, "tr");
      cols.forEach(function (k) { var th = el(doc, "th", model.align(t, k) === "right" ? "hak-num" : "", model.field(t, k).label, { scope: "col" }); hr.appendChild(th); });
      if (c.versioning) hr.appendChild(el(doc, "th", "", "Trạng thái", { scope: "col" }));
      if (actions) hr.appendChild(el(doc, "th", "hak-md-actions-col", "", { scope: "col", "aria-label": "Thao tác" }));
      thead.appendChild(hr); tb.appendChild(thead);

        if (c.versioning) { var st = model.versionStatus(t, r); var td = el(doc, "td"); td.appendChild(el(doc, "span", "hak-md-tag", { current: "Đang hiệu lực", future: "Chưa đến ngày", expired: "Hết hiệu lực" }[st], { "data-status": st })); tr.appendChild(td); }
        if (actions) { var tdA = el(doc, "td", "hak-md-row-actions"); actions(r).forEach(function (b) { tdA.appendChild(b); }); tr.appendChild(tdA); }

    }

    function button(text, cls, onClick, attrs) { var b = el(doc, "button", "hak-btn" + (cls ? " " + cls : ""), text, Object.assign({ type: "button" }, attrs || {})); b.addEventListener("click", onClick); return b; }

    function searchBox(t) {

    function render() {

      // Đầu trang: breadcrumb + tiêu đề + hành động

        else li.appendChild(el(doc, "span", "", b.label, { "aria-current": "page" }));

      });

      var titleRow = el(doc, "div", "hak-md-title-row");
      titleRow.appendChild(el(doc, "h1", "", level === 0 ? (model.config.title || c.labelPlural || c.label) : c.label + ": " + model.titleOf(cur.table, model.getRow(cur.table, cur.id))));
      var acts = el(doc, "div", "hak-md-actions");
      if (level > 0) acts.appendChild(button("← Quay lại", "", function () { model.back(level - 1); }));
      if (model.canEdit(cur.table) && level === 0) acts.appendChild(button("+ Thêm " + lc(c.label), "hak-btn-primary", function () { openDrawer(cur.table, null, parentId); }));
      titleRow.appendChild(acts); head.appendChild(titleRow);
      host.appendChild(head);

      // Thẻ tóm tắt
      var sum = model.summary(cur.table, parentId), metrics = el(doc, "div", "hak-md-metrics");
      function metric(label, value) { var m = el(doc, "div", "hak-md-metric"); m.appendChild(el(doc, "small", "", label)); m.appendChild(el(doc, "strong", "hak-num", formatNumber(value, 0))); metrics.appendChild(m); }
      metric(level === 0 ? "Số " + lc(c.label) + " đang lọc" : "Dòng " + lc(c.label), sum.total);
      if (sum.current != null) { metric("Đang hiệu lực", sum.current); metric("Số mã", sum.codes); }
      metric("Bảng con", model.childTables(cur.table).length);
      host.appendChild(metrics);

      // Hai vùng: danh sách (trái) — hồ sơ đang chọn (phải)

      var mh = el(doc, "div", "hak-toolbar"); mh.appendChild(el(doc, "h2", "hak-md-pane-title", c.labelPlural || c.label)); mh.appendChild(searchBox(cur.table));
      master.appendChild(mh);
      master.appendChild(table(cur.table, model.rowsFor(cur.table, parentId), cur.id, function (r) { model.select(r._id); }));

      if (!row) detail.appendChild(el(doc, "div", "hak-state", "Chọn một " + lc(c.label) + " ở danh sách để xem hồ sơ.", { "data-state": "empty" }));
      else renderDetail(detail, cur.table, row);

      host.appendChild(grid);

    function renderDetail(box, t, row) {

      if (!kids.length) return;

      var bar = el(doc, "div", "hak-toolbar");
      if (model.canEdit(active)) bar.appendChild(button("+ Thêm " + lc(kc.label), "hak-btn-primary", function () { openDrawer(active, null, row._id); }));
      panel.appendChild(bar);
      panel.appendChild(table(active, model.rowsFor(active, row._id), null, null, function (r) {

        if (!yes) return null;
        return model.remove(t, row._id).then(function (r) { notify(r.ok ? "Đã xóa." + (r.warning ? " " + r.warning : "") : r.message, r.ok ? (r.warning ? "warn" : "ok") : "error"); return r; });
      });
    }

    // ----- Side Drawer Thêm/Sửa

        var opts2 = f.refTable ? model.rows(f.refTable).map(function (r) { return { v: r._id, l: r[f.refLabel || "_id"] }; }) : (f.options || []).map(function (o) { return { v: o, l: o }; });
        opts2.forEach(function (o) { w.appendChild(el(doc, "option", "", o.l, { value: o.v, selected: String(o.v) === String(value) })); });

      var dr = el(doc, "aside", "hak-md-drawer", null, { role: "dialog", "aria-modal": "true", "aria-labelledby": "hak-md-drawer-title" });
      var hd = el(doc, "header", "hak-md-drawer-head");
      hd.appendChild(el(doc, "h2", "", (isNew ? "Thêm " : "Sửa ") + lc(c.label), { id: "hak-md-drawer-title" }));
      hd.appendChild(button("✕", "hak-md-close", function () { closeDrawer(); }, { "aria-label": "Đóng" }));
      dr.appendChild(hd);
      var form = el(doc, "form", "hak-md-form", null, { novalidate: true });
      var summaryBox = el(doc, "div", "hak-md-error-summary", null, { role: "alert", tabindex: -1, hidden: true });
      form.appendChild(summaryBox);
      var vcfg = c.versioning;
      c.fields.forEach(function (f) {
        var wrap = el(doc, "div", "hak-md-input");
        var lab = el(doc, "label", "", f.label, { for: "hak-md-f-" + f.key });
        if (f.required) lab.appendChild(el(doc, "span", "hak-md-req", " *", { "aria-hidden": "true" }));
        wrap.appendChild(lab);
        wrap.appendChild(input(t, f, row ? row[f.key] : f.default));
        var hint = f.hint || (vcfg && f.key === vcfg.toField ? "Để trống: tự đóng khi có phiên bản mới cùng mã" : "");
        if (hint) wrap.appendChild(el(doc, "div", "hak-muted hak-md-hint", hint));
        wrap.appendChild(el(doc, "div", "hak-field-error", "", { id: "hak-md-e-" + f.key, hidden: true }));
        form.appendChild(wrap);
      });
      var ft = el(doc, "footer", "hak-md-drawer-foot");
      var saveBtn = el(doc, "button", "hak-btn hak-btn-primary", "Lưu", { type: "submit" });
      ft.appendChild(button("Hủy", "", function () { closeDrawer(); }));
      ft.appendChild(saveBtn);
      form.appendChild(ft);
      form.addEventListener("submit", function (e) {

          saveBtn.disabled = false; saveBtn.textContent = "Lưu";

          if (r.ok) { closeDrawer(true); render(); notify("Đã lưu." + (r.warning ? " " + r.warning : ""), r.warning ? "warn" : "ok"); return r; }
          var errs = r.errors || {}, keys = Object.keys(errs);

          if (keys.length) {
            var ul = el(doc, "ul");
            keys.forEach(function (k) {

              var li = el(doc, "li"), a = el(doc, "a", "", errs[k], { href: "#hak-md-f-" + k });
              a.addEventListener("click", function (ev) { ev.preventDefault(); if (w) w.focus(); });
              li.appendChild(a); ul.appendChild(li);
            });
            summaryBox.appendChild(ul);
          }
          summaryBox.hidden = false; summaryBox.focus();
          return r;
        });
      });
      dr.appendChild(form);
      overlay.appendChild(dr);
      // đóng khi bấm đúng nền mờ (không dùng stopPropagation — bài học từ skill quan-ly-bang-me-bang-con)
      overlay.addEventListener("mousedown", function (e) { if (e.target === overlay) closeDrawer(); });
      overlay.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { e.preventDefault(); closeDrawer(); return; }

    }

    render();
    return {

      destroy: function () { unsub(); closeDrawer(true); while (host.firstChild) host.removeChild(host.firstChild); host.classList.remove("hak-md"); },
    };
  }

  return { VERSION: VERSION, createModel: createModel, mount: mount, memoryAdapter: memoryAdapter, validateConfig: validateConfig, toISO: toISO, fold: fold };
});

(function(){
