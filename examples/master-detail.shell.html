<title>HAK Master–Detail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*__CSS__*/
/* Bố cục trang demo: một thanh chủ đề phía trên, component chiếm phần còn lại. Màu lấy từ token của Design System. */
:root{--demo-font:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--demo-font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.demo-wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.demo-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:var(--r,12px);padding:10px 14px}
.demo-bar p{margin:0;font-size:13px;color:var(--mut-aa,var(--mut));max-width:60ch}
.demo-bar strong{color:var(--ink)}
.demo-seg{display:inline-flex;border:1px solid var(--ctl);border-radius:999px;padding:2px;gap:2px}
.demo-seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;min-height:32px}
.demo-seg button[aria-pressed=true]{background:var(--brand);color:var(--onBrand)}
.demo-seg button:focus-visible,.hak-md :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hak-md button,.hak-md input,.hak-md select,.hak-md textarea{font-family:var(--demo-font)}
.hak-md .hak-panel{min-width:0}
.hak-md .hak-toolbar{justify-content:space-between}
.demo-confirm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--focus);z-index:60;padding:16px}
.demo-confirm>div{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r,12px);box-shadow:var(--shadowH);padding:16px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
.demo-confirm p{margin:0}
.demo-confirm .row{display:flex;justify-content:flex-end;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<div class="demo-wrap">
  <div class="demo-bar">
    <p><strong>Dữ liệu giả.</strong> Bấm một nhân viên để xem hồ sơ, mở tab Hợp đồng, bấm “Xem chi tiết →” để vào phụ lục. Thử Thêm/Sửa/Xóa — thay đổi chỉ nằm trong trang này.</p>
    <div class="demo-seg" role="group" aria-label="Chủ đề">
      <button type="button" id="skin-luxe" aria-pressed="true">Luxe</button>
      <button type="button" id="skin-reu" aria-pressed="false">Xanh rêu</button>
    </div>
  </div>
  <div id="app"></div>
</div>
<script>
/*__JS__*/
</script>
<script>
/*__DATA__*/
(function(){
  var root=document.documentElement;
  root.setAttribute('data-skin','luxe');
  // Theo chế độ sáng/tối của người xem khi họ để "hệ thống" (luxe.css dùng [data-theme="dark"])
  var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null, ours=false;
  function sync(){ if(root.hasAttribute('data-theme')&&!ours) return; ours=true; root.setAttribute('data-theme', mq&&mq.matches?'dark':'light'); }
  sync(); if(mq&&mq.addEventListener) mq.addEventListener('change',function(){ if(ours) { root.removeAttribute('data-theme'); sync(); } });
  function skin(s){ root.setAttribute('data-skin',s); document.getElementById('skin-luxe').setAttribute('aria-pressed',String(s==='luxe')); document.getElementById('skin-reu').setAttribute('aria-pressed',String(s==='reu')); try{localStorage.setItem('hak-md-skin',s);}catch(e){} }
  document.getElementById('skin-luxe').addEventListener('click',function(){skin('luxe');});
  document.getElementById('skin-reu').addEventListener('click',function(){skin('reu');});
  try{ var saved=localStorage.getItem('hak-md-skin'); if(saved==='reu') skin('reu'); }catch(e){}
  // Hộp xác nhận trong trang (khung xem không hiện confirm())
  function ask(msg){ return new Promise(function(res){ var o=document.createElement('div'); o.className='demo-confirm'; var b=document.createElement('div'); b.setAttribute('role','alertdialog'); b.setAttribute('aria-modal','true'); var p=document.createElement('p'); p.textContent=msg; var row=document.createElement('div'); row.className='row';
    var no=document.createElement('button'); no.className='hak-btn'; no.type='button'; no.textContent='Không';
    var yes=document.createElement('button'); yes.className='hak-btn hak-btn-primary'; yes.type='button'; yes.textContent='Xóa';
    function done(v){ o.remove(); res(v); } no.onclick=function(){done(false);}; yes.onclick=function(){done(true);};
    o.addEventListener('keydown',function(e){ if(e.key==='Escape') done(false); });
    row.append(no,yes); b.append(p,row); o.append(b); document.body.append(o); no.focus(); }); }
  var MD=window.HAK.masterDetail;
  var model=MD.createModel(DEMO.config,{data:DEMO.data()});
  MD.mount(document.getElementById('app'),model,{confirm:ask});
  model.load();
})();
</script>
